EXCHANGE_RATE_API_KEY=EXCHANGE_RATE_API_KEY

quarkus.rest-client.exchange-api.url=https://v6.exchangerate-api.com/v6/${EXCHANGE_RATE_API_KEY}

# Prefix for generated account numbers (DK + Bankdata)
bank.identifier=DKBD

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=Bank Account API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Bank accounts (create, deposit, transfer, balance) and DKK-USD exchange
# Serve Swagger UI at /q/swagger-ui in all profiles (on by default in dev only)
quarkus.swagger-ui.always-include=true